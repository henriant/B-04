name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Mobile/**"
  pull_request:
    paths:
      - "Mobile/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --filter Mobile... --frozen-lockfile

      - name: Type check
        run: pnpm --filter Mobile exec tsc --noEmit

      - name: Lint
        run: pnpm --filter Mobile run lint --if-present