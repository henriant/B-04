name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Mobile/**"
  pull_request:
    paths:
      - "Mobile/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix Mobile

      - name: Type check
        run: npm --prefix Mobile exec tsc --noEmit

      - name: Lint
        run: npm --prefix Mobile run lint --if-present