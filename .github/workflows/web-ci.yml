name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Web/**"
      - "Tests/web/**"
      - "Tests/backend/**"
      - "backend/api/d1-http/**"
      - "backend/src/db/**"
      - "packages/api-client/**"
  pull_request:
    paths:
      - "Web/**"
      - "Tests/web/**"
      - "Tests/backend/**"
      - "backend/api/d1-http/**"
      - "backend/src/db/**"
      - "packages/api-client/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir Web install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm --dir Web run types 2>/dev/null || pnpm --dir Web exec tsc --noEmit

      - name: Build
        run: pnpm --dir Web build